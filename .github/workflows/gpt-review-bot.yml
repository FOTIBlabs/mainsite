name: GPT 검수 봇

on:
  schedule:
    # 10분마다 실행 (GitHub 스케줄은 부하 상황에 따라 몇 분 늦게 실행될 수 있음)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
    # ↑ Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: GPT 검수 스크립트 실행
        env:
          COLLAB_API_BASE: https://fotiblabs.com
          COLLAB_TOKEN: ${{ secrets.COLLAB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          MAX_RETRIES: '3'
        run: node scripts/gpt-review-bot.mjs
