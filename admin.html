<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 채팅 — FOTIB Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0A0D12;
    --bg-raised:#12161E;
    --bg-inset:#060809;
    --line:#232935;
    --line-soft:#171C25;
    --text:#ECE9E2;
    --text-dim:#939AA8;
    --text-faint:#565D6B;
    --accent:#E8A659;
    --accent-dim:#B9834A;
    --accent-wash:rgba(232,166,89,0.12);
    --flow:#5AA9E6;
    --observe:#9B7EDE;
    --tune:#E8A659;
    --iterate:#E8735A;
    --balance:#5FBF95;
    --font-display:'Big Shoulders Display',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --wrap:1180px;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  .wrap{ max-width:var(--wrap); margin:0 auto; padding-inline:clamp(1.25rem,4vw,3rem); }

  .nav{
    position:sticky; top:0; z-index:40;
    background:rgba(10,13,18,0.9);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .nav-inner{
    max-width:var(--wrap); margin:0 auto;
    padding:0.85rem clamp(1.25rem,4vw,3rem);
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
  }
  .nav-brand{ display:flex; align-items:baseline; gap:0.6rem; text-decoration:none; }
  .nav-brand .wordmark-small{
    font-family:var(--font-display); font-weight:800; font-size:1.15rem;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  .nav-tag{
    font-family:var(--font-mono); font-size:0.72rem; color:var(--accent);
    letter-spacing:0.08em; text-transform:uppercase; border:1px solid var(--accent-dim);
    border-radius:999px; padding:0.15rem 0.6rem;
  }
  .nav-actions{ display:flex; align-items:center; gap:0.9rem; font-family:var(--font-mono); font-size:0.8rem; }
  .nav-actions a{ color:var(--text-dim); text-decoration:none; }
  .nav-actions a:hover{ color:var(--text); }

  .page-head{ padding-block:clamp(2rem,5vw,3rem) 1.5rem; }
  .eyebrow{
    font-family:var(--font-mono); font-size:0.75rem; font-weight:500;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--accent);
  }
  h1{
    font-family:var(--font-display); text-transform:uppercase; font-weight:800;
    font-size:clamp(1.8rem,4vw,2.6rem); margin:0.4rem 0 0.6rem;
  }
  .page-lead{ color:var(--text-dim); max-width:60ch; font-size:0.98rem; }

  .gate{
    max-width:520px; margin:3rem auto; padding:1.5rem; border:1px solid var(--line-soft);
    border-radius:8px; background:var(--bg-raised); text-align:center;
  }
  .gate p{ color:var(--text-dim); margin-bottom:1rem; }
  .btn{
    font-family:var(--font-mono); font-size:0.85rem; letter-spacing:0.04em;
    text-decoration:none; padding:0.7rem 1.3rem; border-radius:3px;
    display:inline-flex; align-items:center; gap:0.5rem; cursor:pointer;
    transition:transform .2s ease, background .2s ease, border-color .2s ease;
    border:1px solid var(--line); background:transparent; color:var(--text);
  }
  .btn:hover{ transform:translateY(-2px); border-color:var(--text-dim); }
  .btn-primary{ background:var(--accent); color:#191207; font-weight:600; border-color:var(--accent); }
  .btn-primary:hover{ background:#f0b56f; }

  /* ---------- collab (관리자 페이지에서 재사용) ---------- */
  .collab-shell{
    display:grid; grid-template-columns:15rem 1fr;
    border:1px solid var(--line-soft); border-radius:6px; overflow:hidden;
    background:var(--bg-raised); margin-bottom:2rem;
  }
  @media (max-width:760px){ .collab-shell{ grid-template-columns:1fr; } }

  .collab-rooms{
    border-right:1px solid var(--line-soft); padding:0.5rem;
    max-height:560px; overflow-y:auto;
    display:flex; flex-direction:column; gap:0.3rem;
  }
  @media (max-width:760px){ .collab-rooms{ border-right:none; border-bottom:1px solid var(--line-soft); max-height:220px; } }
  .collab-room-btn{
    display:block; width:100%; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:4px;
    padding:0.65rem 0.75rem; cursor:pointer; color:var(--text); font-family:var(--font-body);
  }
  .collab-room-btn:hover{ border-color:var(--line); }
  .collab-room-btn.is-active{ background:var(--accent-wash); border-color:var(--accent); }
  .collab-room-name{ font-weight:700; font-size:0.92rem; display:block; margin-bottom:0.3rem; }
  .collab-room-meta{
    display:flex; align-items:center; gap:0.4rem;
    font-family:var(--font-mono); font-size:0.68rem; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .collab-phase-dot{ width:7px;height:7px;border-radius:50%; background:var(--phase-color); display:inline-block; flex-shrink:0; }

  .collab-room{ display:flex; flex-direction:column; min-height:480px; }
  .collab-room-head{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:0.9rem 1.1rem; border-bottom:1px solid var(--line-soft);
    font-family:var(--font-mono); font-size:0.8rem; color:var(--text-dim);
  }
  .collab-room-title{ color:var(--text); font-weight:600; }

  .collab-thread{
    flex:1; overflow-y:auto; padding:1rem 1.1rem;
    display:flex; flex-direction:column; gap:0.9rem; max-height:480px;
  }
  .collab-empty{ color:var(--text-faint); font-size:0.85rem; font-family:var(--font-mono); }

  .collab-msg{ display:flex; flex-direction:column; gap:0.3rem; max-width:86%; }
  .collab-msg.from-user{ align-self:flex-end; max-width:94%; }
  .collab-msg-head{ display:flex; align-items:baseline; gap:0.5rem; font-family:var(--font-mono); font-size:0.72rem; flex-wrap:wrap; }
  .collab-msg-sender{ font-weight:700; }
  .collab-msg-time{ color:var(--text-faint); }
  .collab-msg-kind{ padding:0.1rem 0.45rem; border-radius:999px; border:1px solid currentColor; font-size:0.62rem; letter-spacing:0.03em; }
  .collab-msg-body{
    background:var(--bg-inset); border:1px solid var(--line-soft); border-radius:6px;
    padding:0.65rem 0.85rem; font-size:0.9rem; color:var(--text); white-space:pre-wrap; line-height:1.55;
  }
  .collab-msg.from-user .collab-msg-body{ background:var(--accent-wash); border-color:var(--accent-dim); }

  .collab-compose{ display:flex; flex-direction:column; gap:0.5rem; padding:0.9rem 1.1rem; border-top:1px solid var(--line-soft); }
  .collab-input{
    background:var(--bg-inset); border:1px solid var(--line); border-radius:4px; color:var(--text);
    padding:0.55rem 0.7rem; font-family:var(--font-body); font-size:0.9rem; resize:vertical; width:100%;
  }
  .collab-input:focus{ outline:none; border-color:var(--accent); }
  .collab-input-sm{ max-width:14rem; }
  .collab-send{ align-self:flex-end; }
  .collab-status{
    padding:0 1.1rem 0.9rem; font-family:var(--font-mono); font-size:0.72rem;
    color:var(--iterate); min-height:1em; text-align:right;
  }
  .collab-status.is-ok{ color:var(--balance); }
  .collab-status.is-pending{ color:var(--text-dim); }
</style>
</head>
<body>

  <div class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="/">
        <span class="wordmark-small">FOTIB</span>
        <span class="nav-tag">관리자</span>
      </a>
      <div class="nav-actions">
        <a href="/#collab">← 공개 진행상황으로</a>
        <a href="#" id="logoutLink">로그아웃</a>
      </div>
    </div>
  </div>

  <div class="wrap page-head">
    <p class="eyebrow">ADMIN ONLY</p>
    <h1>관리자 채팅 페이지</h1>
    <p class="page-lead">여기서 GPT/클로드에게 직접 지시하고, 상세한 진행 내역을 주고받습니다. 이 페이지 내용은 공개 홈 화면에는 보이지 않습니다.</p>
  </div>

  <div class="wrap">
    <div id="gate" class="gate" hidden>
      <p id="gateMsg">관리자 토큰이 필요합니다.</p>
      <a class="btn btn-primary" href="/#collab">홈에서 로그인하기</a>
    </div>

    <div id="app" hidden>
      <div class="collab-shell">
        <aside class="collab-rooms" id="collabRooms"></aside>

        <div class="collab-room">
          <div class="collab-room-head">
            <span class="collab-room-title" id="collabRoomTitle">프로젝트를 선택하세요</span>
          </div>
          <div class="collab-thread" id="collabThread">
            <p class="collab-empty">왼쪽에서 프로젝트를 선택하면 상세 대화가 여기 표시됩니다.</p>
          </div>
          <div class="collab-compose" id="collabCompose" hidden>
            <input type="text" id="collabSender" class="collab-input collab-input-sm" placeholder="이름 (예: Lee)">
            <textarea id="collabContent" class="collab-input" rows="2" placeholder="지시 내용 입력…"></textarea>
            <button class="btn btn-primary collab-send" id="collabSendBtn" type="button">보내기</button>
          </div>
          <p class="collab-status" id="collabStatus" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  var API = '/api/collab';
  var TOKEN_KEY = 'fotib_collab_token';
  var ADMIN_SUFFIX = '-admin';

  var gateEl = document.getElementById('gate');
  var gateMsgEl = document.getElementById('gateMsg');
  var appEl = document.getElementById('app');
  var roomsEl = document.getElementById('collabRooms');
  var threadEl = document.getElementById('collabThread');
  var titleEl = document.getElementById('collabRoomTitle');
  var composeEl = document.getElementById('collabCompose');
  var senderInput = document.getElementById('collabSender');
  var contentInput = document.getElementById('collabContent');
  var sendBtn = document.getElementById('collabSendBtn');
  var statusEl = document.getElementById('collabStatus');
  var logoutLink = document.getElementById('logoutLink');

  function getToken(){
    try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; }
  }

  function showStatus(msg, type){
    statusEl.textContent = msg || '';
    statusEl.classList.remove('is-ok','is-pending');
    if(type === 'ok' || type === 'pending') statusEl.classList.add('is-' + type);
    if(msg && type !== 'pending'){
      setTimeout(function(){ if(statusEl.textContent === msg){ statusEl.textContent = ''; } }, 4000);
    }
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function fmtTime(iso){
    try{
      var d = new Date(iso + (iso.indexOf('Z')===-1 && iso.indexOf('+')===-1 ? 'Z' : ''));
      return d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return iso; }
  }

  var PHASE_COLORS = { flow:'var(--flow)', observe:'var(--observe)', tune:'var(--tune)', iterate:'var(--iterate)', balance:'var(--balance)' };
  var PHASE_LIST = Object.keys(PHASE_COLORS);
  function hashColor(str){
    var h = 0;
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 997; }
    return PHASE_COLORS[PHASE_LIST[Math.abs(h) % PHASE_LIST.length]];
  }

  var projectsCache = [];
  var activeProject = null; // 공개 프로젝트 id (표시용) — 실제 통신은 activeProject + '-admin' 스레드로 함
  var lastMsgId = 0;
  var pollTimer = null;
  var roomsPollTimer = null;

  function adminThreadId(publicId){ return publicId + ADMIN_SUFFIX; }

  function renderRooms(){
    if(!projectsCache.length){
      roomsEl.innerHTML = '<p class="collab-empty">아직 프로젝트가 없습니다. 홈 화면에서 먼저 만들어주세요.</p>';
      return;
    }
    roomsEl.innerHTML = projectsCache.map(function(p){
      var color = PHASE_COLORS[p.phase] || 'var(--flow)';
      return '<button class="collab-room-btn' + (p.id===activeProject ? ' is-active' : '') + '" data-id="' + esc(p.id) + '">' +
        '<span class="collab-room-name">' + esc(p.name) + '</span>' +
        '<span class="collab-room-meta"><span class="collab-phase-dot" style="--phase-color:' + color + '"></span>' + esc((p.phase||'flow').toUpperCase()) + ' · ' + esc(p.status||'active') + '</span>' +
      '</button>';
    }).join('');
  }

  function buildMessageEl(m){
    var isUser = m.sender === 'user';
    var color = isUser ? 'var(--accent)' : hashColor(m.sender);
    var div = document.createElement('div');
    div.className = 'collab-msg' + (isUser ? ' from-user' : '');
    var kindBadge = m.kind ? ('<span class="collab-msg-kind" style="color:' + color + '">' + esc(m.kind) + '</span>') : '';
    div.innerHTML =
      '<div class="collab-msg-head"><span class="collab-msg-sender" style="color:' + color + '">' + esc(m.sender_label || m.sender) + '</span>' + kindBadge + '<span class="collab-msg-time">' + fmtTime(m.created_at) + '</span></div>' +
      '<div class="collab-msg-body"></div>';
    div.querySelector('.collab-msg-body').textContent = m.content;
    return div;
  }

  function appendMessages(list){
    if(!list.length) return;
    if(threadEl.querySelector('.collab-empty')) threadEl.innerHTML = '';
    list.forEach(function(m){
      threadEl.appendChild(buildMessageEl(m));
      lastMsgId = Math.max(lastMsgId, m.id);
    });
    threadEl.scrollTop = threadEl.scrollHeight;
  }

  function loadMessages(){
    if(!activeProject) return;
    var token = getToken();
    fetch(API + '/projects/' + encodeURIComponent(adminThreadId(activeProject)) + '/messages?after=' + lastMsgId, {
      headers: token ? { 'authorization': 'Bearer ' + token } : {}
    })
      .then(function(r){
        if(r.status === 401){ handleUnauthorized(); return null; }
        return r.json();
      })
      .then(function(data){ if(data) appendMessages(data.messages || []); })
      .catch(function(){});
  }

  function resetPoll(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadMessages, 4000);
  }

  function selectProject(id){
    activeProject = id;
    lastMsgId = 0;
    var p = projectsCache.find(function(x){ return x.id === id; });
    titleEl.textContent = (p && p.name) || id;
    threadEl.innerHTML = '<p class="collab-empty">불러오는 중…</p>';
    composeEl.hidden = false;
    renderRooms();
    loadMessages();
    resetPoll();
    try{ history.replaceState(null, '', '/admin.html?project=' + encodeURIComponent(id)); }catch(e){}
  }

  function loadRooms(){
    fetch(API + '/projects').then(function(r){ return r.json(); }).then(function(data){
      projectsCache = data.projects || [];
      renderRooms();
      if(!activeProject){
        var qs = new URLSearchParams(location.search);
        var wanted = qs.get('project');
        if(wanted && projectsCache.some(function(p){ return p.id === wanted; })){
          selectProject(wanted);
        } else if(projectsCache.length){
          selectProject(projectsCache[0].id);
        }
      }
    }).catch(function(){
      roomsEl.innerHTML = '<p class="collab-empty">연결에 실패했습니다.</p>';
    });
  }

  roomsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.collab-room-btn');
    if(!btn) return;
    selectProject(btn.getAttribute('data-id'));
  });

  sendBtn.addEventListener('click', function(){
    if(!activeProject){ showStatus('먼저 프로젝트를 선택하세요.'); return; }
    var content = contentInput.value.trim();
    if(!content) return;
    var token = getToken();
    if(!token){ handleUnauthorized(); return; }
    var label = senderInput.value.trim() || 'Lee';
    sendBtn.disabled = true;
    fetch(API + '/projects/' + encodeURIComponent(adminThreadId(activeProject)) + '/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + token },
      body: JSON.stringify({ sender:'user', sender_label:label, content:content, kind:'command' })
    }).then(function(r){
      sendBtn.disabled = false;
      if(r.status === 401){ handleUnauthorized(); return; }
      if(!r.ok){ showStatus('전송에 실패했습니다.'); return; }
      contentInput.value = '';
      loadMessages();
    }).catch(function(){
      sendBtn.disabled = false;
      showStatus('전송 중 오류가 발생했습니다.');
    });
  });

  contentInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendBtn.click(); }
  });

  logoutLink.addEventListener('click', function(e){
    e.preventDefault();
    try{ localStorage.removeItem(TOKEN_KEY); }catch(err){}
    location.href = '/#collab';
  });

  function handleUnauthorized(){
    try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
    showGate('토큰이 만료되었거나 올바르지 않습니다. 홈에서 다시 로그인해주세요.');
  }

  function showGate(msg){
    if(pollTimer) clearInterval(pollTimer);
    if(roomsPollTimer) clearInterval(roomsPollTimer);
    gateMsgEl.textContent = msg;
    gateEl.hidden = false;
    appEl.hidden = true;
  }

  function init(){
    var token = getToken();
    if(!token){
      showGate('관리자 토큰이 필요합니다. 홈 화면에서 먼저 로그인해주세요.');
      return;
    }
    fetch(API + '/whoami', { headers: { 'authorization': 'Bearer ' + token } })
      .then(function(r){
        if(!r.ok){
          try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
          showGate('토큰이 올바르지 않습니다. 홈 화면에서 다시 로그인해주세요.');
          return;
        }
        gateEl.hidden = true;
        appEl.hidden = false;
        loadRooms();
        roomsPollTimer = setInterval(loadRooms, 15000);
      })
      .catch(function(){
        showGate('연결에 실패했습니다. 잠시 후 새로고침해주세요.');
      });
  }

  init();
})();
</script>
</body>
</html>
